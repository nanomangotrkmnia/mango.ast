plugins {
    id 'java'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.6'
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
}

group = 'mango.ast'
version = '1.0.0'
base {
    archivesName = 'openastralis'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://jitpack.io' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    // Minecraft + mappings
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()

    // Fabric loader
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'

    // Fabric API
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    implementation 'org.jetbrains:annotations:24.0.1'

    // Runtime / feature libraries (Maven Central)
    implementation 'javazoom:jlayer:1.0.1'
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.json:json:20240303'
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'org.ow2.asm:asm:9.7'
    implementation 'org.ow2.asm:asm-commons:9.7'

    // Skija (rendering)
    implementation 'io.github.humbleui:skija-shared:0.116.8'

    // Dear ImGui
    implementation 'io.github.spair:imgui-java-binding:1.86.11'
    implementation 'io.github.spair:imgui-java-lwjgl3:1.86.11'

    // MixinExtras
    implementation 'io.github.llamalad7:mixinextras-fabric:0.5.4'
}

loom {
    // If you use an access widener, uncomment and point to the file:
    // accessWidener = file('resources/mymod.accesswidener')
}

tasks.processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '500']
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

jar {
    manifest {
        attributes(
            'Specification-Title': 'OpenAstralis',
            'Specification-Vendor': 'nanomangotrkmnia',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
}

shadowJar {
    archiveClassifier.set('all')
    mergeServiceFiles()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
