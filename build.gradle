plugins {
    id 'java'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'net.fabricmc.fabric-loom-remap' version '1.14'
}

group = 'cc.astralis'
version = '1.0.0'
archivesBaseName = 'openastralis'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    main {
        java {
            setSrcDirs(['java'])
        }
        resources {
            setSrcDirs(['resources'])
        }
    }
}

dependencies {
    // Minecraft + mappings
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'official'

    // Fabric API (optional — only if your mod needs it)
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.88.0+1.21.11'

    // Lombok is referenced in the code (e.g. @Getter)
    compileOnly 'org.projectlombok:lombok:1.18.26'
    annotationProcessor 'org.projectlombok:lombok:1.18.26'

    implementation 'org.jetbrains:annotations:24.0.1'
}

loom {
    // If you use an access widener, uncomment and point to the file:
    // accessWidener = file('resources/mymod.accesswidener')
}

tasks.processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes(
            'Specification-Title': 'OpenAstralis',
            'Specification-Vendor': 'nanomangotrkmnia',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
}

shadowJar {
    archiveClassifier.set('all')
    mergeServiceFiles()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
